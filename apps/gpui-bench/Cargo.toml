[package]
name = "cakify-gpui-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cakify-bench-protocol = { path = "../../crates/bench-protocol" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "b2d9c2e122fbc408d42276b4456243ba4f90f181", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b2d9c2e122fbc408d42276b4456243ba4f90f181", package = "gpui_platform" }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
