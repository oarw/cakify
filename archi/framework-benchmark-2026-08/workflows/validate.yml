name: Validate shared core

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-rust:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate fixture manifest
        shell: pwsh
        run: ./scripts/windows/validate-fixture.ps1
      - name: Record toolchain
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V
      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Run Rust contract tests
        shell: pwsh
        run: cargo test --workspace
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-lock-${{ github.run_id }}
          path: Cargo.lock
          if-no-files-found: warn
