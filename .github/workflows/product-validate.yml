name: Product validate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Record toolchain
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V

      - name: Record dependency tree and enforce license boundary
        shell: pwsh
        run: |
          $tree = cargo tree --workspace --locked --prefix none
          $tree | Set-Content -LiteralPath dependency-tree.txt -Encoding utf8
          $forbidden = $tree | Select-String -Pattern '^(agent|agent_ui|language_model|context_server) v[0-9]'
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error $_.Line }
            throw 'Zed GPL AI business crates are not allowed in the product dependency tree.'
          }

      - name: Check formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) {
            cargo fmt --all
            git diff --binary | Out-File -LiteralPath rustfmt.patch -Encoding utf8
            throw 'Rust formatting differs; apply rustfmt.patch from the artifact.'
          }

      - name: Check workspace
        shell: pwsh
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Run storage contract tests
        shell: pwsh
        run: cargo test --package cakify-storage --test storage_contract --locked

      - name: Run repository contract tests
        shell: pwsh
        run: cargo test --package cakify-storage --test repository_contract --locked

      - name: Run provider profile contract tests
        shell: pwsh
        run: cargo test --package cakify-storage --test provider_profile_contract --locked

      - name: Run MCP server persistence contract tests
        shell: pwsh
        run: cargo test --package cakify-storage --test mcp_server_contract --locked

      - name: Run tool approval loop contract tests
        shell: pwsh
        run: cargo test --package cakify-core approved_tool_executes_and_continues_the_model_turn --locked

      - name: Run secret lifecycle contract tests
        shell: pwsh
        run: cargo test --package cakify-core secret::tests --locked

      - name: Run Windows secret backend contract tests
        shell: pwsh
        run: cargo test --package cakify-platform-windows --test secret_contract --locked

      - name: Run clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build release desktop
        shell: pwsh
        run: cargo build --release --package cakify-desktop --locked

      - name: Upload product validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-validation-${{ github.run_id }}
          path: |
            Cargo.lock
            dependency-tree.txt
            rustfmt.patch
            crates/cakify-storage/migrations/*.sql
            target/release/cakify-desktop.exe
            target/.rustc_info.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
