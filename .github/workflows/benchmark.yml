name: Benchmark scaffold

on:
  workflow_dispatch:
    inputs:
      run_count:
        description: "Number of planned samples per candidate"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scaffold:
    name: ${{ matrix.candidate }} scaffold
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        candidate: [gpui, avalonia, flutter, tauri]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate shared contract
        shell: pwsh
        run: ./scripts/windows/validate-fixture.ps1
      - name: Emit scaffold artifact
        shell: pwsh
        env:
          RUN_COUNT: ${{ inputs.run_count }}
        run: ./scripts/windows/benchmark-scaffold.ps1 -Candidate "${{ matrix.candidate }}" -RunCount ([int]$env:RUN_COUNT) -OutputDirectory "results/${{ matrix.candidate }}"
      - name: Upload scaffold metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ matrix.candidate }}-${{ github.run_id }}
          path: results/${{ matrix.candidate }}/
          if-no-files-found: error
