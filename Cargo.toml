[workspace]
resolver = "2"
members = [
    "apps/cakify-desktop",
    "crates/cakify-core",
    "crates/cakify-mcp",
    "crates/cakify-platform-windows",
    "crates/cakify-provider",
    "crates/cakify-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[workspace.dependencies]
async-channel = "=2.5.0"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "b2d9c2e122fbc408d42276b4456243ba4f90f181", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b2d9c2e122fbc408d42276b4456243ba4f90f181", package = "gpui_platform" }
pulldown-cmark = { version = "=0.13.4", default-features = false }
process-wrap = { version = "=9.1.0", default-features = false, features = ["job-object", "kill-on-drop", "tokio1"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rmcp = { version = "=3.1.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "net", "process", "rt", "sync", "time"] }
unicode-segmentation = "=1.13.3"
url = "=2.5.8"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
